name: Portfolio browser checks
on:
  push:
    branches: [portfolio-pwa-check-20261122, portfolio-study-upgrade-20261122, portfolio-focus-20261125, portfolio-vocabit-20261125]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: pip install 'playwright==1.56.0' 'Pillow==11.3.0'
      - run: |
          python -m http.server 8193 --bind 127.0.0.1 --directory studio-apps >/tmp/studio-server.log 2>&1 &
          python studio-apps/checks/browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-previews
          path: studio-apps/*/preview.webp

