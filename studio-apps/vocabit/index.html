<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#0b0d12"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="description" content="Vocabit – spielerisch Vokabeln lernen mit XP, Streaks und kurzen Sessions."/>

  <title>Vocabit</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="img/icon512_rounded.png">
  <link rel="apple-touch-icon" href="img/icon512_rounded.png">
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <img class="brandLogo" src="img/logo.svg" alt="Vocabit Logo" width="44" height="44">
        <div class="brandText">
          <div class="brandTitle">Vocabit</div>
          <div class="brandSub">Wörter lernen. Punkte sammeln.</div>
        </div>
      </div>

      <button class="iconBtn" id="openSettings" aria-label="Einstellungen" title="Einstellungen">⚙️</button>
    </header>

    <section class="card">
      <div class="cardHeaderRow">
        <div class="cardHeader">Tägliche Runde</div>
        <div class="chip" id="streakChip" title="Streak">🔥 0</div>
      </div>

      <div class="cardBody">
        <div class="bigWord" id="word">—</div>
        <p class="smallHint">Was bedeutet das auf Deutsch?</p>

        <form id="quizForm" class="stack">
          <input class="input" id="germanText" type="text" placeholder="Deutsch..." autocomplete="off" required>
          <button class="btnPrimary" type="submit">Loslegen</button>
        </form>

        <div class="resultRow">
          <div id="text" role="status" class="resultText">Bereit</div>
          <div class="actionGroup">
            <button class="btnSoft btnSmall" id="hintBtn" type="button">Tipp</button>
            <button class="btnSoft btnSmall" id="skipBtn" type="button" title="Neues Wort">Weiter</button>
          </div>
        </div>

        <div class="progressWrap">
          <div class="progressLabel">
            <span>Cooldown</span>
            <span id="nextWordIn">Nächstes Wort in —</span>
          </div>
          <div class="progressBar">
            <div class="progressFill" id="progressFill" style="width:0%"></div>
          </div>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="cardHeader">Fortschritt</div>
      <div class="cardBody">
        <div class="statsGrid">
          <div class="statBox">
            <div class="statLabel">XP-Kombo</div>
            <div class="statValue" id="comboValue">0</div>
          </div>
          <div class="statBox">
            <div class="statLabel">Punkte</div>
            <div class="statValue" id="xpValue">0</div>
          </div>
          <div class="statBox">
            <div class="statLabel">Richtig</div>
            <div class="statValue" id="correctValue">0</div>
          </div>
          <div class="statBox">
            <div class="statLabel">Falsch</div>
            <div class="statValue" id="wrongValue">0</div>
          </div>
        </div>

        <button class="btnMuted" id="bonusBtn" type="button">Weitere Wörter hinzufügen</button>
      </div>
    </section>

    <div class="footerTiny">© 2026 Lara Jacqueline Volkmer</div>
  </div>

  <nav class="bottomNav">
    <a class="navItem active" href="index.html" aria-current="page">
      <span class="navDot"></span>
      Training
    </a>
    <a class="navItem" href="add.html">
      <span class="navDot"></span>
      Wörter
    </a>
  </nav>

  <div class="modalBackdrop" id="modalBackdrop" hidden></div>
  <div class="modal" id="settingsModal" hidden role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="modalHeader">
      <div>
        <div class="modalTitle" id="settingsTitle">Einstellungen</div>
        <div class="modalSub">Klein, sauber, nützlich.</div>
      </div>
      <button class="iconBtn" id="closeSettings" aria-label="Schließen">✕</button>
    </div>

    <div class="modalBody stack">
      <button class="btnDanger" id="resetStatsBtn" type="button">Stats zurücksetzen</button>
      <button class="btnDanger" id="resetVocabBtn" type="button">Eigene Wörter löschen</button>
      <button class="btnMuted" id="closeSettings2" type="button">Fertig</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
