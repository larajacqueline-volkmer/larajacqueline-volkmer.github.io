<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#0b0d12"/>
  <meta name="description" content="Vocabit – eigene Vokabeln ergänzen und verwalten."/>

  <title>Vocabit – Wörter</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="img/icon512_rounded.png">
  <link rel="apple-touch-icon" href="img/icon512_rounded.png">
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <img class="brandLogo" src="img/logo.svg" alt="Vocabit Logo" width="44" height="44">
        <div class="brandText">
          <div class="brandTitle">Vocabit</div>
          <div class="brandSub">Neue Wörter sammeln</div>
        </div>
      </div>

      <a class="iconBtn" href="index.html" aria-label="Zurück" title="Zurück">←</a>
    </header>

    <section class="card">
      <div class="cardHeader">Wort hinzufügen</div>
      <div class="cardBody">
        <form id="addForm" class="stack">
          <input class="input" id="germanText" type="text" placeholder="Deutsch..." autocomplete="off" required>
          <input class="input" id="englishText" type="text" placeholder="Englisch..." autocomplete="off" required>
          <button class="btnPrimary" type="submit">Wort speichern</button>
        </form>

        <div class="divider"></div>

        <div class="listHeaderRow">
          <div class="listTitle">Deine Wörter</div>
          <button class="btnMuted btnSmall" id="refreshBtn" type="button" title="Aktualisieren">Aktualisieren</button>
        </div>

        <ul id="vocabularyList"></ul>
      </div>
    </section>

    <div class="footerTiny">© 2026 Lara Jacqueline Volkmer</div>
  </div>

  <nav class="bottomNav">
    <a class="navItem" href="index.html">
      <span class="navDot"></span>
      Training
    </a>
    <a class="navItem active" href="add.html" aria-current="page">
      <span class="navDot"></span>
      Wörter
    </a>
  </nav>

  <script src="script.js"></script>
</body>
</html>
