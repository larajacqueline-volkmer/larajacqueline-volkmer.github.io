<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mindmap Studio</title><link rel="stylesheet" href="styles.css"><script defer src="app.js"></script><link rel="manifest" href="manifest.webmanifest"><script defer src="./pwa-register.js"></script></head><body><main class="map-shell"><header><img src="icons/mindmap-192.png" width="48" height="48" alt=""><h1>Mindmap Studio</h1></header><p>Tippe auf einen Knoten, um ihn zu bearbeiten. Ziehe ihn an eine neue Position.</p><div class="map-actions"><button id="newNode">Zweig hinzufügen</button><button id="undo">Zurück</button><button id="redo">Wiederholen</button><button id="export">JSON exportieren</button></div><div id="canvasWrap" class="stage"><canvas id="map" width="620" height="510" aria-label="Mindmap"></canvas></div><form id="editor"><label>Titel <input id="nodeTitle" maxlength="60" required></label><label>Farbe <input type="color" id="nodeColor" value="#7755b6"></label><button>Übernehmen</button></form></main></body></html>
