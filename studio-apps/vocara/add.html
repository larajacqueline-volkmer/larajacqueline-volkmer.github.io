    <main>
      <div class="page">
        <h1>Vokabel hinzufügen</h1>
        <form id="add-word-form" class="card-like" style="max-width:1100px">
          <label for="word-de">Deutsch</label>
          <input id="word-de" type="text" placeholder="Deutsch..." />

          <label for="word-foreign">Fremdsprache oder Abkürzungen</label>
          <input id="word-foreign" type="text" placeholder="Fremdsprache oder Abkürzungen..." />

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px">
            <div>
              <label for="language">Sprache</label>
              <select id="language"></select>
            </div>
            <div>
              <label for="difficulty">Schwierigkeit</label>
              <select id="difficulty"></select>
            </div>
          </div>

          <div style="margin-top:14px">
            <button class="btn btn-primary" type="submit">Hinzufügen</button>
          </div>
        </form>

        <h2 style="margin-top:28px">Aktuelle Vokabeln</h2>
        <div id="wordListMini"></div>
      </div>
