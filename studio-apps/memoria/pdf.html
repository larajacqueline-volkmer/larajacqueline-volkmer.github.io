<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF öffnen · Memoria</title><link rel="stylesheet" href="style.css"><link rel="manifest" href="manifest.webmanifest"><script defer src="./pwa-register.js"></script></head><body><main class="container"><p><a href="index.html">← Memoria</a></p><section class="card"><h1>PDF öffnen</h1><p>Wähle ein Dokument auf deinem Gerät.</p><input type="file" id="document" accept="application/pdf"><p><a id="open" hidden target="_blank" rel="noopener">PDF in eigenem Tab öffnen</a></p><iframe title="PDF-Vorschau" hidden style="width:100%;height:65vh;border:0"></iframe></section></main><script>let current;document.querySelector('input').onchange=e=>{const file=e.target.files[0];if(!file)return;if(current)URL.revokeObjectURL(current);current=URL.createObjectURL(file);const frame=document.querySelector('iframe'),link=document.querySelector('#open');frame.src=link.href=current;frame.hidden=link.hidden=false;};</script></body></html>
